<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUNI_APP - Sistema LF & ITSE</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('muni_theme');
          if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Pantalla de carga mientras baja el JS. Debe verse igual que AppLoader.vue (Vue la reemplaza al montar). */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #f4f4f4; font-family: Inter, system-ui, sans-serif; }
      html.dark .boot { background: #0f0f11; }
      .boot img { width: 80px; height: auto; }
      .boot-title { margin: 0; font-size: 18px; font-weight: 800; color: #00356a; }
      html.dark .boot-title { color: #fff; }
      .boot-sub { margin: 2px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #737373; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status">
        <img src="/images/escudo-dashboard.png" alt="Escudo de la Municipalidad Distrital de Morales" />
        <div>
          <p class="boot-title">MUNI_APP</p>
          <p class="boot-sub">Sistema LF &amp; ITSE</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
